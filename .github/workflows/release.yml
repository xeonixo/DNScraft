name: Release

# Release: git tag vX.Y.Z -> multi-arch image on ghcr.io + GitHub Release.
#   git tag v0.1.0 && git push origin v0.1.0
# Each arch builds natively in parallel (no QEMU); a final job merges them
# into one multi-arch manifest.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # GitHub Release
  packages: write # ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag must match crate version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="dnscraft") | .version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != crates/dnscraft version v$v" >&2; exit 1; }

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: 0.1.0, 0.1, latest (latest/minor skipped for pre-releases like v0.2.0-rc.1).
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Merge manifests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in digest-*; do echo "${IMAGE,,}@$(cat "$f")"; done)

      # Full history + tags so we can build notes from commits since the previous tag.
      # (--generate-notes only lists merged PRs; this repo releases from direct commits.)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          img=${IMAGE,,}:${GITHUB_REF_NAME#v}
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          prev=$(git tag --list 'v*' --sort=-v:refname \
            | awk -v cur="$GITHUB_REF_NAME" '$0 != cur { print; exit }')
          {
            echo "Image: \`docker pull $img\`"
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' --no-merges "$prev..$GITHUB_REF_NAME" \
                | grep -vE '^- chore: release v' || true
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              git log --pretty=format:'- %s (%h)' --no-merges "$GITHUB_REF_NAME" \
                | grep -vE '^- chore: release v' || true
              echo
            fi
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/release-notes.md $pre
