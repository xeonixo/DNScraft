# Dev/smoke stack for the dnscraft binary (example.com / RFC 5737 only).
# Not a production template: control API is plain HTTP on loopback :80, no
# TLS and no seeded admin. See deploy/README.md for production hardening.
#
#   docker compose up --build
#   dig @127.0.0.1 -p 5300 example.com A +short
#   curl -fsS http://127.0.0.1:80/healthz

services:
  dnscraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: dnscraft:local
    ports:
      - "5300:5300/udp"
      - "5300:5300/tcp"
      # Plain HTTP on loopback only. Do not publish 443 here — enable TLS +
      # auth first, then map 443 in a production override (deploy/README.md).
      - "127.0.0.1:80:80/tcp"
    volumes:
      - dnscraft-data:/var/lib/dnscraft
      - ./deploy/dnscraft.docker.toml:/etc/dnscraft/config.toml:ro
    environment:
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 45s
    restart: unless-stopped

volumes:
  dnscraft-data:
