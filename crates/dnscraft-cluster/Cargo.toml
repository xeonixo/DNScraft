[package]
name = "dnscraft-cluster"
version = "0.3.9"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Master/sub-node cluster identity, config, and node registry for DNScraft"

[lints]
workspace = true

[dependencies]
dnscraft-common = { path = "../dnscraft-common" }
async-trait = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
ring = { workspace = true }
rcgen = { workspace = true }
time = { workspace = true, features = ["formatting"] }
x509-parser = { workspace = true }
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
tower-service = "0.3.3"
zstd = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
