# Dev/smoke Docker configuration (documentation addresses only).
#
# NOT for production: plain HTTP, wildcard bind inside the container, no TLS.
# Compose maps the API to loopback on the host. Production: enable tls=true,
# set a real public_domain, seed DNSCRAFT_ADMIN_PASSWORD_FILE (then remove it),
# and follow deploy/README.md.
#
# Used by the default image and docker compose. Mount a host directory on
# /var/lib/dnscraft for persistence. Secrets (TLS, OIDC, UniFi, Cloudflare,
# cluster join) are supplied via environment variables or mounted files — never
# baked into the image.

public_domain = "example.com"
data_dir = "/var/lib/dnscraft"

[log]
queries = false
# level = "info"   # system messages on stderr: error | warn | info | debug | trace

[[listeners]]
id = "lan-udp"
protocol = "udp53"
address = "0.0.0.0:5300"

[[listeners]]
id = "lan-tcp"
protocol = "tcp53"
address = "0.0.0.0:5300"

[control_api]
bind = "0.0.0.0"
# Containers only: the published port is the exposure control (compose maps it to loopback).
allow_wildcard_bind = true
# Plain HTTP sample: port 80. With `tls = true` prefer 443 (crate default).
port = 80
tls = false

[control_api.mcp]
enabled = false
